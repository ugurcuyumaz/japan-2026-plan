    <script>
      const redirectTarget = sessionStorage.getItem('redirect');
      if (redirectTarget) {
        sessionStorage.removeItem('redirect');
        const redirectUrl = new URL(redirectTarget, window.location.origin);
        if (redirectUrl.origin === window.location.origin && redirectUrl.pathname.startsWith('/japan-2026-plan/')) {
          window.history.replaceState(null, '', `${redirectUrl.pathname}${redirectUrl.search}${redirectUrl.hash}`);
        }
      }
    </script>
